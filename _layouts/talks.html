---
layout: default
---

{{ content }}

<h3 class="fw-bold border-bottom pb-3 mb-5">Talks</h3>

{% for talk in site.data.settings.talks %}
<div class="row g-4 mb-5">
  <div class="col-md-12">
    <h5>{{ talk.title }}</h5>
    <p class="mb-1"><strong>Date:</strong> {{ talk.date }}</p>
    <p class="mb-1"><strong>Venue:</strong> {{ talk.venue }}</p>
    
    #!-- This links to the individual abstract page --
    <p class="mt-2"><a href="{{ site.github.url }}/talks/{{ talk.url }}" class="btn btn-outline-primary btn-sm">Abstract</a></p>
  </div>
</div>
{% endfor %}
